# ==== Runtime / executor layout (single machine) ====
spark.master=local[4]
spark.executor.instances=1
spark.executor.cores=4
spark.task.cpus=4
spark.executor.memory=16g
spark.driver.memory=4g

# ==== RAPIDS / GPU gating (single GPU, serialize GPU work) ====
spark.plugins=com.nvidia.spark.SQLPlugin
spark.rapids.sql.enabled=true
spark.rapids.sql.concurrentGpuTasks=1

# ==== Batching / memory / I/O ====
spark.rapids.sql.batchSizeBytes=512m
spark.rapids.memory.pinnedPool.size=1g
spark.sql.files.maxPartitionBytes=256m
spark.sql.shuffle.partitions=32

# ==== Env / paths ====
spark.sql.session.timeZone=UTC
spark.executorEnv.TZ=UTC
spark.driverEnv.TZ=UTC
spark.jars=./jars/rapids-4-spark_2.13-25.08.0.jar,./jars/jmorphy2-core-0.2.3.jar,./jars/jmorphy-spark-1.0-SNAPSHOT.jar,./jars/dawg-0.2.3.jar,./jars/morfologik-stemming-2.1.9.jar,./jars/noggit-0.8.jar,./jars/jmorphy2-dicts-uk-0.2.3-2.4.1.1.1460299261.jar,./jars/jmorphy2-nlp-0.2.3.jar,./jars/morfologik-fsa-2.1.9.jar,./jars/morfologik-ukrainian-lt-6.5.6.jar
spark.executor.extraLibraryPath=./native
spark.driver.extraLibraryPath=./native
