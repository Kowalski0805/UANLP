# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

# Example:
# spark.master                     spark://master:7077
# spark.eventLog.enabled           true
# spark.eventLog.dir               hdfs://namenode:8021/directory
# spark.serializer                 org.apache.spark.serializer.KryoSerializer
# spark.driver.memory              5g
# spark.executor.extraJavaOptions  -XX:+PrintGCDetails -Dkey=value -Dnumbers="one two three"
spark.driver.memory                 4g
spark.jars                          ./jars/jmorphy2-core-0.2.3.jar,./jars/jmorphy-spark-1.0-SNAPSHOT.jar,./jars/dawg-0.2.3.jar,./jars/rapids-4-spark_2.13-25.08.0.jar,./jars/morfologik-stemming-2.1.9.jar,./jars/noggit-0.8.jar,./jars/jmorphy2-dicts-uk-0.2.3-2.4.1.1.1460299261.jar,./jars/jmorphy2-nlp-0.2.3.jar,./jars/morfologik-fsa-2.1.9.jar,./jars/morfologik-ukrainian-lt-6.5.6.jar
spark.executor.extraLibraryPath     ./native
spark.driver.extraLibraryPath       ./native
spark.plugins                       com.nvidia.spark.SQLPlugin
spark.rapids.sql.concurrentGpuTasks 1
spark.rapids.sql.enabled            true
spark.sql.session.timeZone          UTC
spark.executorEnv.TZ                UTC
spark.driverEnv.TZ                  UTC
# === Concurrency gating (single GPU; avoid contention) ===
spark.task.cpus=4
spark.rapids.sql.multiThreadedRead.numThreads=4

# === Sensible batching / I/O ===
spark.rapids.sql.batchSizeBytes=512m
spark.rapids.memory.pinnedPool.size=1g
spark.sql.files.maxPartitionBytes=256m
spark.sql.shuffle.partitions=96
